<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S.</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#03080d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="JARVIS">
<style>
  :root {
    --cyan: #00e5ff;
    --cyan-dim: #00779a;
    --bg: #03080d;
    --panel: rgba(0, 229, 255, 0.05);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: radial-gradient(circle at center, #071a24 0%, var(--bg) 70%);
    color: var(--cyan);
    font-family: "Courier New", monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
  }
  header {
    margin-top: 24px;
    letter-spacing: 0.4em;
    font-size: 14px;
    opacity: 0.8;
  }
  .core {
    position: relative;
    width: 320px;
    height: 320px;
    margin: 30px 0;
  }
  .ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid var(--cyan);
    box-shadow: 0 0 20px var(--cyan-dim), inset 0 0 20px var(--cyan-dim);
  }
  .ring.r1 { inset: 0; border-style: dashed; animation: spin 14s linear infinite; }
  .ring.r2 { inset: 30px; border-width: 1px; animation: spin 9s linear infinite reverse; }
  .ring.r3 { inset: 60px; border-style: dotted; animation: spin 5s linear infinite; }
  .orb {
    position: absolute;
    inset: 110px;
    border-radius: 50%;
    background: radial-gradient(circle, #ffffff 0%, var(--cyan) 40%, transparent 75%);
    animation: pulse 2s ease-in-out infinite;
  }
  .orb.speaking { animation: pulse 0.5s ease-in-out infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse {
    0%, 100% { transform: scale(0.9); opacity: 0.8; }
    50% { transform: scale(1.1); opacity: 1; }
  }
  #status {
    font-size: 15px;
    letter-spacing: 0.15em;
    min-height: 24px;
    text-align: center;
    padding: 0 20px;
  }
  #log {
    width: min(640px, 92vw);
    height: 220px;
    margin-top: 24px;
    padding: 14px;
    border: 1px solid var(--cyan-dim);
    background: var(--panel);
    overflow-y: auto;
    font-size: 14px;
    line-height: 1.5;
  }
  #log .user { color: #9ff; }
  #log .jarvis { color: var(--cyan); }
  form {
    width: min(640px, 92vw);
    display: flex;
    margin-top: 14px;
  }
  input {
    flex: 1;
    background: transparent;
    border: 1px solid var(--cyan);
    color: var(--cyan);
    padding: 12px;
    font-family: inherit;
    font-size: 15px;
    outline: none;
  }
  button {
    margin-left: 8px;
    background: var(--cyan);
    color: var(--bg);
    border: none;
    padding: 0 20px;
    font-family: inherit;
    font-weight: bold;
    cursor: pointer;
  }
  button:hover { background: #fff; }
  #mic {
    margin-top: 12px;
    background: transparent;
    color: var(--cyan);
    border: 1px solid var(--cyan);
    padding: 10px 20px;
  }
  #mic.listening { background: var(--cyan); color: var(--bg); }
</style>
</head>
<body>
  <header>J.A.R.V.I.S. — SISTEMA ONLINE</header>

  <div class="core">
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="ring r3"></div>
    <div class="orb" id="orb"></div>
  </div>

  <div id="status">In attesa di comandi, signore.</div>

  <div id="log"></div>

  <form id="form">
    <input id="input" type="text" placeholder="Scrivi un comando..." autocomplete="off">
    <button type="submit">INVIA</button>
  </form>

  <button id="mic">🎤 PARLA</button>

<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
  }

  const log = document.getElementById("log");
  const statusEl = document.getElementById("status");
  const orb = document.getElementById("orb");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const micBtn = document.getElementById("mic");

  // Risposte di base: sostituiscile o collega un'API di AI per una vera intelligenza
  const responses = {
    "ciao": "Buongiorno, signore. Tutti i sistemi sono operativi.",
    "come stai": "Sempre al massimo delle prestazioni, signore.",
    "ora": () => "Sono le " + new Date().toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" }) + ".",
    "data": () => "Oggi è " + new Date().toLocaleDateString("it-IT", { weekday: "long", day: "numeric", month: "long", year: "numeric" }) + ".",
  };

  function addLine(who, text) {
    const div = document.createElement("div");
    div.className = who;
    div.textContent = (who === "user" ? "> " : "JARVIS: ") + text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }

  function speak(text) {
    if (!("speechSynthesis" in window)) return;
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "it-IT";
    u.pitch = 0.8;
    u.rate = 1.0;
    u.onstart = () => { orb.classList.add("speaking"); statusEl.textContent = "Parlando..."; };
    u.onend = () => { orb.classList.remove("speaking"); statusEl.textContent = "In attesa di comandi, signore."; };
    speechSynthesis.speak(u);
  }

  function respond(command) {
    const key = command.toLowerCase().trim().replace(/[?!.]/g, "");
    let reply;
    if (responses[key]) {
      reply = typeof responses[key] === "function" ? responses[key]() : responses[key];
    } else {
      reply = "Mi dispiace, signore, questo comando non è ancora supportato.";
    }
    addLine("jarvis", reply);
    speak(reply);
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    addLine("user", text);
    input.value = "";
    respond(text);
  });

  // Riconoscimento vocale (Chrome / Edge)
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SR) {
    const rec = new SR();
    rec.lang = "it-IT";
    rec.onstart = () => { micBtn.classList.add("listening"); statusEl.textContent = "In ascolto..."; };
    rec.onend = () => { micBtn.classList.remove("listening"); statusEl.textContent = "In attesa di comandi, signore."; };
    rec.onresult = (e) => {
      const text = e.results[0][0].transcript;
      addLine("user", text);
      respond(text);
    };
    micBtn.addEventListener("click", () => rec.start());
  } else {
    micBtn.disabled = true;
    micBtn.textContent = "Voce non supportata";
  }
</script>
</body>
</html>
